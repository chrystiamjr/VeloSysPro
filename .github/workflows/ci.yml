name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    tags: ['v*']

jobs:
  frontend:
    name: Frontend (validate + E2E)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate (type-check + ESLint + Vitest unit)
        run: npm run validate
      - name: E2E (Cypress against Vite dev server)
        uses: cypress-io/github-action@v6
        with:
          install: false
          start: npm run dev
          wait-on: 'http://localhost:5173'
          wait-on-timeout: 120

  desktop:
    name: Desktop (.NET 8 build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: npm ci
      - name: Build UI (required for embedded resources)
        run: npm run build
      - name: Build desktop host
        run: dotnet build desktop/VeloSysPro.csproj -c Release
      - name: Test desktop (xUnit)
        run: dotnet test desktop.Tests/VeloSysPro.Tests.csproj -c Release

  release:
    name: Release (single-file exe + installer)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [frontend, desktop]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: npm ci
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build (frontend + single-file exe + installer)
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File build.ps1
      - name: Publish installer to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VeloSysPro-Setup-*.exe
