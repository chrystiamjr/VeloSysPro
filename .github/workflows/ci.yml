name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend (validate + E2E)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Cypress binary
        run: npx cypress install
        env:
          CYPRESS_CACHE_FOLDER: ${{ runner.temp }}\Cypress
      - name: Validate PR title (Conventional Commit)
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ($env:PR_AUTHOR -eq 'dependabot[bot]') {
            if ($env:PR_TITLE -notmatch '^chore\(deps\): [Bb]ump .+') {
              Write-Error "Unexpected Dependabot PR title: $env:PR_TITLE"
              exit 1
            }

            Write-Host "Valid Dependabot dependency update title."
            exit 0
          }

          $env:PR_TITLE | npx commitlint
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
      - name: Validate (type-check + Prettier + ESLint + Vitest unit)
        run: npm run validate
      - name: E2E (Cypress against Vite dev server)
        uses: cypress-io/github-action@v7
        env:
          CYPRESS_CACHE_FOLDER: ${{ runner.temp }}\Cypress
        with:
          install: false
          start: npm run dev
          wait-on: 'http://localhost:5173'
          wait-on-timeout: 120
      - name: Upload Cypress failure screenshots
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: cypress-failure-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7

  desktop:
    name: Desktop (.NET 8 build + test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: npm ci
      - name: Build UI (required for embedded resources)
        run: npm run build
      - name: Build desktop host
        run: dotnet build desktop/VeloSysPro.csproj -c Release
      - name: Test desktop (xUnit)
        run: dotnet test desktop.Tests/VeloSysPro.Tests.csproj -c Release

  release:
    name: Release (semantic-release)
    # Only on pushes to the default branch (not on PRs).
    if: github.event_name == 'push'
    needs: [frontend, desktop]
    runs-on: windows-latest
    permissions:
      contents: write # create tags and GitHub Releases
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # semantic-release needs full history + tags
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: npm ci
      - name: Install Inno Setup (for the installer)
        run: choco install innosetup -y --no-progress
      # semantic-release decides the next version from Conventional Commits,
      # builds in the runner workspace, commits the synchronized version files
      # with [skip ci], tags that release commit, and publishes the installer.
      - name: Semantic Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
