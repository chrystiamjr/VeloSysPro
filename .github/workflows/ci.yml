name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (validate + E2E)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate (type-check + Prettier + ESLint + Vitest unit)
        run: npm run validate
      - name: E2E (Cypress against Vite dev server)
        uses: cypress-io/github-action@v6
        with:
          install: false
          start: npm run dev
          wait-on: 'http://localhost:5173'
          wait-on-timeout: 120

  desktop:
    name: Desktop (.NET 8 build + test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: npm ci
      - name: Build UI (required for embedded resources)
        run: npm run build
      - name: Build desktop host
        run: dotnet build desktop/VeloSysPro.csproj -c Release
      - name: Test desktop (xUnit)
        run: dotnet test desktop.Tests/VeloSysPro.Tests.csproj -c Release

  release:
    name: Release (semantic-release)
    # Only on pushes to the default branch (not on PRs).
    if: github.event_name == 'push'
    needs: [frontend, desktop]
    runs-on: windows-latest
    permissions:
      contents: write # create tags, releases, and the release commit
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs full history + tags
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: npm ci
      - name: Install Inno Setup (for the installer)
        run: choco install innosetup -y --no-progress
      # semantic-release decides the next version from Conventional Commits, runs
      # scripts/sync-version.mjs + build.ps1 (via @semantic-release/exec), tags,
      # commits the version bump + CHANGELOG, and publishes a GitHub Release with
      # dist/VeloSysPro-Setup-<version>.exe attached.
      - name: Semantic Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
